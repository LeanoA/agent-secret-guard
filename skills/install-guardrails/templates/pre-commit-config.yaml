# Commit guardrails installed by claude-code-guardrails.
# Blocks commits that contain secrets or private keys.
# Docs: https://github.com/LeanoA/claude-code-guardrails
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
